services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --default-time-zone=+00:00
      - --collation-server=utf8mb4_0900_as_ci
      - --transaction-isolation=READ-COMMITTED
    environment:
      MYSQL_DATABASE: ${DB_NAME:-ats}
      MYSQL_USER: ${DB_USER:-ats}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - ats_mysqldata:/var/lib/mysql
    healthcheck:
      # TCP only: the temporary server of the first initialization does not listen on the network.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  ats_mysqldata:
