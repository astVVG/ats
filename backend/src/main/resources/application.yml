spring:
  application:
    name: ats-backend
  profiles:
    default: dev
  datasource:
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
      data-source-properties:
        # Every JDBC session works in UTC, whatever the zone of the JVM or the server.
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
        preserveInstants: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: PT2H
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:Administrator}
  uploads:
    # Resumes are stored under {dir}/resumes/{candidateId}/.
    dir: ${UPLOADS_DIR:./uploads}
  metrics:
    # Zone of the day boundaries for the from and to filters of /api/metrics.
    time-zone: America/Mexico_City
