spring:
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:${DB_PORT:3306}/${DB_NAME:ats}
    username: ${DB_USER:ats}
    password: ${DB_PASSWORD}

logging:
  level:
    io.github.astvvg.ats: DEBUG

app:
  demo:
    # Password of the demo recruiter, recruiter@demo.test; without it that user is not created.
    recruiter-password: ${DEMO_RECRUITER_PASSWORD:}
